<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12314F"/>
      <stop offset="100%" stop-color="#0A1C2E"/>
    </linearGradient>
    <linearGradient id="soleil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="verre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9FC7E8"/>
      <stop offset="100%" stop-color="#5E90BC"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#ciel)"/>

  <!-- rayons -->
  <g stroke="#F59E0B" stroke-width="18" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="60"  x2="256" y2="96"/>
    <line x1="140" y1="108" x2="166" y2="134"/>
    <line x1="372" y1="108" x2="346" y2="134"/>
    <line x1="96"  y1="224" x2="132" y2="224"/>
    <line x1="416" y1="224" x2="380" y2="224"/>
  </g>

  <!-- soleil -->
  <circle cx="256" cy="224" r="86" fill="url(#soleil)"/>

  <!-- panneau incline plein sud -->
  <g transform="rotate(-20 256 384)">
    <rect x="96" y="348" width="320" height="82" rx="10" fill="url(#verre)"/>
    <g stroke="#0A1C2E" stroke-width="9" opacity="0.55">
      <line x1="176" y1="348" x2="176" y2="430"/>
      <line x1="256" y1="348" x2="256" y2="430"/>
      <line x1="336" y1="348" x2="336" y2="430"/>
      <line x1="96"  y1="389" x2="416" y2="389"/>
    </g>
  </g>
</svg>
